name: BareMetal_PLCs CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build_bmplc:
    runs-on: [self-hosted]
    strategy:
      matrix:
        plc_type: ["BMPLC_M", "BMPLC_XL", "G0B1"]
        include:
          - plc_type: "BMPLC_M"
            jlink_serial: 'JLINK_SERIAL_CI_BMPLC_M'
            mcu: "STM32F103RE"
            build_dir: "build_m"
            test: true
          - plc_type: "BMPLC_XL"
            jlink_serial: 'JLINK_SERIAL_CI_BMPLC_XL'
            mcu: "STM32F765ZG"
            build_dir: "build_xl"
            test: true
          - plc_type: "G0B1"
            jlink_serial: 'JLINK_SERIAL_CI_G0B1'
            mcu: "STM32G0B1KC"
            build_dir: "build_g0b1"
            test: false
    name: Build ${{ matrix.plc_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0
      
      - name: Configure project
        run: |
          mkdir ${{ matrix.build_dir }}
          cd ${{ matrix.build_dir }}
          cmake -DPLC_TYPE="${{ matrix.plc_type }}" -DCMAKE_BUILD_TYPE=Debug ..

      - name: Build project
        run: |
          cd ${{ matrix.build_dir }}
          cmake --build .

      - name: Flash firmware
        if: matrix.test == true
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install bmlab-toolkit
          bml flash ${{ matrix.build_dir }}/bmplc.bin --serial ${{ secrets[matrix.jlink_serial] }} --mcu ${{ matrix.mcu }}

      - name: Run unit tests
        if: matrix.test == true
        run: |

          source .venv/bin/activate
          
          TEST_LIST=$(bml rtt --serial ${{ secrets[matrix.jlink_serial] }} --mcu ${{ matrix.mcu }} -t 30 --msg "?" 2>&1 | tr -s ' ' '\n' | grep "_test" || true)
          
          if [ -z "$TEST_LIST" ]; then
            echo "No tests found"
            exit 1
          fi
          
          HAS_FAILURES=0
          
          while IFS= read -r test_name; do
            [ -z "$test_name" ] && continue
            
            echo "Running test: $test_name"
            TEST_OUTPUT=$(bml rtt --serial ${{ secrets[matrix.jlink_serial] }} --mcu ${{ matrix.mcu }} -t 10 --no-reset --msg "$test_name" 2>&1)
            
            echo "$TEST_OUTPUT"
            
            if echo "$TEST_OUTPUT" | grep -q "REPORT"; then
              FAILURES=$(echo "$TEST_OUTPUT" | grep "REPORT" | tail -1 | grep -oP "Failures:\s*\K\d+" || echo "0")
              
              if [ "$FAILURES" -ne 0 ]; then
                echo "❌ Test FAILED: $test_name (Failures: $FAILURES)"
                HAS_FAILURES=1
              else
                echo "✅ Test PASSED: $test_name"
              fi
            else
              echo "❌ Test FAILED: $test_name (No REPORT found)"
              HAS_FAILURES=1
            fi
            echo "---"
          done < <(echo "$TEST_LIST")
          
          exit $HAS_FAILURES
