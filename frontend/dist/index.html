<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMPLC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="layout">

    <header>
      <div class="header-card">
        <h2 id="bmplc-type">BMPLC</h2>
        <p id="serial">serial</p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" type="button" data-lang="ru">RU</button>
        <button class="lang-btn" type="button" data-lang="en">EN</button>
      </div>
    </header>

    <aside class="io-card">
      <h2>Ввод / вывод</h2>

      <div class="io-section">
        <h3 class="io-group-title">Реле</h3>
        <div class="relay-row">
          <button class="relay-btn" type="button" data-group="relay" data-index="0" aria-label="Реле 1" title="Реле 1">
            <svg viewBox="0 0 80 20" aria-hidden="true">
              <circle class="term" cx="20" cy="10" r="8"></circle>
              <circle class="term" cx="60" cy="10" r="8"></circle>
              <line class="lever lever-open" x1="35" y1="10" x2="45" y2="10"></line>
              <line class="lever lever-closed" x1="20" y1="10" x2="60" y2="10"></line>
            </svg>
          </button>
          <button class="relay-btn" type="button" data-group="relay" data-index="1" aria-label="Реле 2" title="Реле 2">
            <svg viewBox="0 0 80 20" aria-hidden="true">
              <circle class="term" cx="20" cy="10" r="8"></circle>
              <circle class="term" cx="60" cy="10" r="8"></circle>
              <line class="lever lever-open" x1="35" y1="10" x2="45" y2="10"></line>
              <line class="lever lever-closed" x1="20" y1="10" x2="60" y2="10"></line>
            </svg>
          </button>
          <button class="relay-btn" type="button" data-group="relay" data-index="2" aria-label="Реле 3" title="Реле 3">
            <svg viewBox="0 0 80 20" aria-hidden="true">
              <circle class="term" cx="20" cy="10" r="8"></circle>
              <circle class="term" cx="60" cy="10" r="8"></circle>
              <line class="lever lever-open" x1="35" y1="10" x2="45" y2="10"></line>
              <line class="lever lever-closed" x1="20" y1="10" x2="60" y2="10"></line>
            </svg>
          </button>
          <button class="relay-btn" type="button" data-group="relay" data-index="3" aria-label="Реле 4" title="Реле 4">
            <svg viewBox="0 0 80 20" aria-hidden="true">
              <circle class="term" cx="20" cy="10" r="8"></circle>
              <circle class="term" cx="60" cy="10" r="8"></circle>
              <line class="lever lever-open" x1="35" y1="10" x2="45" y2="10"></line>
              <line class="lever lever-closed" x1="20" y1="10" x2="60" y2="10"></line>
            </svg>
          </button>
          <button class="relay-btn" type="button" data-group="relay" data-index="4" aria-label="Реле 5" title="Реле 5">
            <svg viewBox="0 0 80 20" aria-hidden="true">
              <circle class="term" cx="20" cy="10" r="8"></circle>
              <circle class="term" cx="60" cy="10" r="8"></circle>
              <line class="lever lever-open" x1="35" y1="10" x2="45" y2="10"></line>
              <line class="lever lever-closed" x1="20" y1="10" x2="60" y2="10"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="io-columns">
        <div class="io-col">
          <h3 class="io-group-title">Входы</h3>
          <div class="io-col-items">
            <span class="io-ind" title="Вход 1"></span>
            <span class="io-ind" title="Вход 2"></span>
            <span class="io-ind" title="Вход 3"></span>
            <span class="io-ind" title="Вход 4"></span>
            <span class="io-ind" title="Вход 5"></span>
          </div>
        </div>
        <div class="io-col">
          <h3 class="io-group-title">Выходы</h3>
          <div class="io-col-items">
            <button class="io-btn" type="button" data-group="do" data-index="0" aria-label="Выход 1"
              title="Выход 1"></button>
            <button class="io-btn" type="button" data-group="do" data-index="1" aria-label="Выход 2"
              title="Выход 2"></button>
            <button class="io-btn" type="button" data-group="do" data-index="2" aria-label="Выход 3"
              title="Выход 3"></button>
            <button class="io-btn" type="button" data-group="do" data-index="3" aria-label="Выход 4"
              title="Выход 4"></button>
            <button class="io-btn" type="button" data-group="do" data-index="4" aria-label="Выход 5"
              title="Выход 5"></button>
          </div>
        </div>
      </div>

    </aside>

    <main class="main-col">
      <div class="tasks-card">
        <h2>Task Load</h2>
        <div id="tasks-content"></div>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>

</html>
